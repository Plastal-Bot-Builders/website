name: Deploy to GitHub Pages

on:
  # Auto-deploy disabled: the site is hosted on Cloudflare Workers. This build
  # produces a root-relative bundle ("homepage": "/"), which GitHub Pages would
  # serve incorrectly from the /website subpath. Kept for reference / emergency
  # fallback only — run it manually from the Actions tab if ever needed.
  #
  # Do NOT set a custom domain under Settings > Pages, and do NOT add a CNAME
  # file. plastalbotbuilders.com is served by Cloudflare Workers; a GitHub Pages
  # claim on the same apex would, if its DNS check ever passed, silently serve a
  # stale build over plain HTTP with no prerendered metadata and none of the
  # security headers from public/_headers.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # CI=false: CRA treats lint warnings as errors on CI runners,
      # and this project has pre-existing warnings
      - run: npm run build
        env:
          CI: false

      # SPA fallback: GitHub Pages serves 404.html for unknown paths, so a
      # copy of index.html lets React Router handle deep links and refreshes
      - run: cp build/index.html build/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - id: deployment
        uses: actions/deploy-pages@v4
