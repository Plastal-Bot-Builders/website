<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>From CAD to the RoboCore controller: the training pipeline</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="300" rx="16" fill="#fcfcfb" stroke="#e1e0d9"/>
  <text x="28" y="40" font-size="20" font-weight="700" fill="#0b0b0b">From CAD to the controller</text>
  <text x="28" y="64" font-size="13" fill="#52514e">Steps 1–4 run today, in simulation. Step 5 is next: errata E-015 (the motor sockets) still blocks driving on the real board.</text>

  <!-- 1 CAD -->
  <rect x="28" y="96" width="140" height="150" rx="12" fill="#ffffff" stroke="#c3c2b7"/>
  <text x="98" y="126" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="middle">1. CAD</text>
  <text x="98" y="152" font-size="12" fill="#52514e" text-anchor="middle">Fusion 360</text>
  <text x="98" y="170" font-size="12" fill="#52514e" text-anchor="middle">wheel-leg robot v3</text>
  <text x="98" y="196" font-size="11" fill="#898781" text-anchor="middle">masses, joints,</text>
  <text x="98" y="212" font-size="11" fill="#898781" text-anchor="middle">meshes</text>

  <!-- 2 model -->
  <rect x="196" y="96" width="140" height="150" rx="12" fill="#ffffff" stroke="#c3c2b7"/>
  <text x="266" y="126" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="middle">2. Physics model</text>
  <text x="266" y="152" font-size="12" fill="#52514e" text-anchor="middle">URDF + MuJoCo</text>
  <text x="266" y="170" font-size="12" fill="#52514e" text-anchor="middle">1 kHz physics</text>
  <text x="266" y="196" font-size="11" fill="#898781" text-anchor="middle">motor + servo models,</text>
  <text x="266" y="212" font-size="11" fill="#898781" text-anchor="middle">parallelogram legs</text>

  <!-- 3 training -->
  <rect x="364" y="96" width="210" height="150" rx="12" fill="#eef4fc" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="469" y="126" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="middle">3. Training (PPO)</text>
  <text x="469" y="152" font-size="12" fill="#52514e" text-anchor="middle">24 randomised robots at once</text>
  <text x="469" y="170" font-size="12" fill="#52514e" text-anchor="middle">40 M steps ≈ 111 h of practice</text>
  <text x="469" y="188" font-size="12" fill="#52514e" text-anchor="middle">in 58 min on a laptop</text>
  <text x="469" y="214" font-size="11" fill="#898781" text-anchor="middle">noise, delays, pushes,</text>
  <text x="469" y="230" font-size="11" fill="#898781" text-anchor="middle">weaker or stronger motors</text>

  <!-- 4 policy -->
  <rect x="602" y="96" width="150" height="150" rx="12" fill="#ffffff" stroke="#c3c2b7"/>
  <text x="677" y="126" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="middle">4. Policy file</text>
  <text x="677" y="152" font-size="12" fill="#52514e" text-anchor="middle">policy.npz, 52 kB</text>
  <text x="677" y="170" font-size="12" fill="#52514e" text-anchor="middle">95 → 64 → 64 → 4</text>
  <text x="677" y="196" font-size="11" fill="#898781" text-anchor="middle">10,432 multiply-adds</text>
  <text x="677" y="212" font-size="11" fill="#898781" text-anchor="middle">per decision</text>

  <!-- divider -->
  <line x1="771" y1="88" x2="771" y2="262" stroke="#898781" stroke-dasharray="5 5"/>
  <text x="771" y="282" font-size="11" fill="#898781" text-anchor="middle">simulation  |  hardware (next)</text>

  <!-- 5 controller -->
  <rect x="790" y="96" width="182" height="150" rx="12" fill="#ffffff" stroke="#e88729" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="881" y="126" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="middle">5. RoboCore V2</text>
  <text x="881" y="152" font-size="12" fill="#52514e" text-anchor="middle">ESP32-S3 runs the</text>
  <text x="881" y="170" font-size="12" fill="#52514e" text-anchor="middle">policy 100× a second</text>
  <text x="881" y="196" font-size="11" fill="#898781" text-anchor="middle">estimated well under 1 ms</text>
  <text x="881" y="212" font-size="11" fill="#898781" text-anchor="middle">of a 10 ms budget</text>

  <!-- arrows -->
  <line x1="170" y1="171" x2="193" y2="171" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="338" y1="171" x2="361" y2="171" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="576" y1="171" x2="599" y2="171" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="754" y1="171" x2="787" y2="171" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/>
</svg>
